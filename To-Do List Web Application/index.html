<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">My To-Do List</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body p-4">
                

                <h3 class="card-title text-center fw-bold">Task Manager</h3>
                <p class="text-muted text-center mb-4">Organize your tasks and stay productive.</p>

                <!-- Task Input Area -->
                <div class="input-group mb-2">
                    <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task...">
                    <button class="btn btn-primary" id="addTaskBtn">Add Task</button>
                </div>
                <div id="errorMsg" class="text-danger small d-none mb-3">Please enter a valid task!</div>

                <!-- Task Counter & Header -->
                <div class="d-flex justify-content-between align-items-center mb-3 mt-4">
                    <span class="fw-semibold">Your tasks</span>
                    <span class="badge bg-primary rounded-pill" id="taskCounter">0 remaining</span>
                </div>


                <div class="btn-group w-100 mb-4" role="group">
                    <input type="radio" class="btn-check" name="filter" id="filterAll" value="all" checked>
                    <label class="btn btn-outline-primary" for="filterAll">All</label>

                    <input type="radio" class="btn-check" name="filter" id="filterActive" value="active">
                    <label class="btn btn-outline-primary" for="filterActive">Active</label>

                    <input type="radio" class="btn-check" name="filter" id="filterCompleted" value="completed">
                    <label class="btn btn-outline-primary" for="filterCompleted">Completed</label>
                </div>


                <ul class="list-group mb-4" id="taskList">

                    <li class="list-group-item text-center text-muted border-0 mt-3" id="emptyMessage">
                        No tasks yet. Add your first task!
                    </li>
                </ul>

                <div class="d-flex justify-content-end border-top pt-3">
                    <button class="btn btn-outline-danger btn-sm" id="clearCompletedBtn">Clear Completed</button>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
